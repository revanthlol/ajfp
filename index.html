{t:"Comparator interface",f:[["ComparatorDemo.java","java",`import java.util.*;
class S {
  String n; int m;
  S(String n, int m) { this.n = n; this.m = m; }
  public String toString() { return n + " " + m; }
}
class MarkCmp implements Comparator<S> {
  public int compare(S a, S b) { return b.m - a.m; }
}
public class ComparatorDemo {
  public static void main(String[] x) {
    List<S> l = new ArrayList<>();
    l.add(new S("Alice", 85));
    l.add(new S("Bob", 92));
    l.add(new S("Charlie", 78));
    Collections.sort(l, new MarkCmp());
    System.out.println(l);
  }
}`]],o:"[Bob 92, Alice 85, Charlie 78]",n:"Highest marks first. Lambda alternative: l.sort((a, b) -> b.m - a.m);"},

{t:"TCP sockets: factorial",f:[["FactServer.java","java",`import java.io.*;
import java.net.*;
public class FactServer {
  public static void main(String[] a) throws Exception {
    ServerSocket ss = new ServerSocket(5000);
    Socket s = ss.accept();
    DataInputStream in = new DataInputStream(s.getInputStream());
    DataOutputStream out = new DataOutputStream(s.getOutputStream());
    int n = in.readInt();
    long f = 1;
    for (int i = 2; i <= n; i++) f *= i;
    out.writeLong(f);
    s.close(); ss.close();
  }
}`],["FactClient.java","java",`import java.io.*;

    DataInputStream in = new DataInputStream(s.getInputStream());
    out.writeInt(5);
    System.out.println("Factorial = " + in.readLong());
    s.close();
  }
}`]],o:"Factorial = 120",n:"Run FactServer first in one terminal, then FactClient in another."},
